name: pilot-usage

# Two UTC pulls. Days 1-15 come from the day-16 pull.
# Days 16 through the end of the month come from the day-1 run.
# Merge keeps the owning pull only, so the 31-day retention boundary does not choose the row.
on:
  schedule:
    - cron: "30 0 16 * *"
    - cron: "30 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Usage plan
        run: node pilot/scripts/usage-report.mjs
