name: pilot-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pinned app commit is an ancestor of main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          ref="$(tr -d '[:space:]' < pilot/HEALTH_MCP_REF)"
          printf '%s\n' "$ref" | grep -Eq '^[0-9a-f]{40}$'
          git merge-base --is-ancestor "$ref" origin/main
      - name: App tests at the pinned commit
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < pilot/HEALTH_MCP_REF)"
          git worktree add --detach /tmp/health-mcp-pin "$ref"
          npm ci --prefix /tmp/health-mcp-pin
          npm test --prefix /tmp/health-mcp-pin
      - name: Pilot tests
        run: npm test
      - name: gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${checksum}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --config .gitleaks.toml
