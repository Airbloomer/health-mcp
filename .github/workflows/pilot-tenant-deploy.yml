name: pilot-tenant-deploy

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: Opaque tenant id
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pilot-tenant-deploy
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    environment: pilot-tenant-deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate tenant target
        env:
          TENANT_ID: ${{ inputs.tenant_id }}
          PILOT_TENANT_DEPLOY_TOKEN: ${{ secrets.PILOT_TENANT_DEPLOY_TOKEN }}
        run: node pilot/scripts/tenant-deploy.mjs
      - name: Audit alert hook
        run: node pilot/scripts/audit-alert.mjs --self-test
